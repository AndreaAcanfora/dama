[project]
name = "dama-training"
version = "0.1.0"
description = "Self-play reinforcement learning for Italian draughts (AlphaZero-style)."
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "torch>=2.5",
  "onnx>=1.17",
]

[dependency-groups]
dev = ["pytest>=8.3", "onnxruntime>=1.20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
